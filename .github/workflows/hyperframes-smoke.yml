name: HyperFrames smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperframes-smoke
  cancel-in-progress: false

jobs:
  render-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out smoke-test project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Report runner resources
        run: |
          nproc
          free -h
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Ensure HyperFrames browser
        run: npx --yes hyperframes@0.8.189 browser ensure

      - name: Check sample composition
        run: npx --yes hyperframes@0.8.189 check --json .

      - name: Render two-second sample
        run: npx --yes hyperframes@0.8.189 render . --quality draft --output output/hyperframes-smoke.mp4

      - name: Verify render
        run: |
          test -s output/hyperframes-smoke.mp4
          python3 - <<'PY'
          import json
          import subprocess

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-of",
                  "json",
                  "output/hyperframes-smoke.mp4",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          duration = float(json.loads(result.stdout)["format"]["duration"])
          if not 1.8 <= duration <= 2.2:
              raise SystemExit(f"Unexpected video duration: {duration:.3f}s")
          print(f"Rendered MP4 duration: {duration:.3f}s")
          PY

      - name: Upload rendered sample
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-smoke-render
          path: output/hyperframes-smoke.mp4
          if-no-files-found: error
          retention-days: 7
